apiVersion: 1

groups:
  - orgId: 1
    name: Proxmox-Eval
    folder: Proxmox Alerts
    interval: 1m
    rules:
      - uid: proxmox_host_ram_high
        title: Proxmox Host RAM High
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: (pve_proxmox_node_memory_memused_bytes / pve_proxmox_node_memory_memtotal_bytes) * 100
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
        for: 5m
        annotations:
          summary: Proxmox Host RAM is above 90%
          description: Memory usage on node PVE has exceeded 90% for 5 minutes.