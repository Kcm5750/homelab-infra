---
node_exporter_version: "1.12.1"

# SHA-256 of the release tarballs, taken from the official sha256sums.txt of the release
# (https://github.com/prometheus/node_exporter/releases). Re-verify when bumping the version.
node_exporter_checksums:
  amd64: b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63
  arm64: ad35b605f9954b9f1ffddf5ba054bdc5a98d790b9eae5291e1eeb83f1ecbd0e7

node_exporter_arch_map:
  x86_64: amd64
  aarch64: arm64

node_exporter_download_base: https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}
node_exporter_download_url: >-
  {{ node_exporter_download_base }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz
node_exporter_install_root: /opt/node_exporter
node_exporter_bin: /usr/local/bin/node_exporter

node_exporter_user: node_exporter
node_exporter_group: node_exporter

node_exporter_listen_address: 0.0.0.0:9100
node_exporter_port: 9100
# Extra command-line flags, e.g. ["--collector.systemd"].
node_exporter_extra_args: []

# Firewall (UFW). Rules are added only if ufw is installed (base_hardening installs it).
node_exporter_manage_firewall: true
# TODO: restrict to the monitoring VM (104) IP once confirmed; the whole lab network is allowed until then.
node_exporter_allowed_sources:
  - 10.10.10.0/24
