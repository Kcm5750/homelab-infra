---
- name: Check platform
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] in ['Ubuntu', 'Debian']
      - ansible_facts['architecture'] in docker_apt_arch_map
    fail_msg: "docker role supports Ubuntu/Debian on {{ docker_apt_arch_map.keys() | join('/') }}."
    quiet: true
  tags: [docker]

- name: Remove conflicting distro packages
  ansible.builtin.apt:
    name: "{{ docker_conflicting_packages }}"
    state: absent
  when: docker_remove_conflicting | bool
  tags: [docker, docker_install]

- name: Install repository prerequisites
  ansible.builtin.apt:
    name: ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [docker, docker_install]

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: "{{ docker_apt_key_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [docker, docker_install]

- name: Install Docker apt signing key
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    dest: "{{ docker_apt_key_path }}"
    checksum: "{{ docker_apt_key_checksum | default(omit) }}"
    owner: root
    group: root
    mode: "0644"
  tags: [docker, docker_install]

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_apt_arch_map[ansible_facts['architecture']] }}
      signed-by={{ docker_apt_key_path }}]
      {{ docker_apt_repo_url }} {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present
    update_cache: true
  tags: [docker, docker_install]

- name: Install Docker Engine and plugins
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
  tags: [docker, docker_install]

- name: Create Docker config directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [docker, docker_config]

- name: Configure Docker daemon
  ansible.builtin.copy:
    content: "{{ docker_daemon_config | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker
  tags: [docker, docker_config]

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  tags: [docker, docker_config]

- name: Add users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  tags: [docker, docker_users]
