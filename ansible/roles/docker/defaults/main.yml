---
docker_apt_key_url: https://download.docker.com/linux/ubuntu/gpg
docker_apt_key_path: /etc/apt/keyrings/docker.asc
# Optional integrity pin for the key file, e.g. "sha256:<hex>". Unset = rely on TLS only.
# docker_apt_key_checksum: "sha256:..."
docker_apt_repo_url: https://download.docker.com/linux/ubuntu

docker_apt_arch_map:
  x86_64: amd64
  aarch64: arm64

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Opt-in: remove distro packages that conflict with Docker's own.
docker_remove_conflicting: false
docker_conflicting_packages:
  - docker.io
  - docker-compose
  - docker-compose-v2
  - docker-doc
  - podman-docker
  - containerd
  - runc

# Written to /etc/docker/daemon.json. Log rotation stops container logs filling the disk.
docker_daemon_config:
  log-driver: json-file
  log-opts:
    max-size: 10m
    max-file: "3"
  live-restore: true

# Users added to the docker group. Membership is effectively root access.
docker_users: []
