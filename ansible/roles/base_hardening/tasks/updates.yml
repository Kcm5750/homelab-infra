---
- name: Updates | Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Updates | Enable periodic update and upgrade runs
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Updates | Restrict to security updates
  ansible.builtin.template:
    src: 52-unattended-upgrades-hardening.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-hardening
    owner: root
    group: root
    mode: "0644"

- name: Updates | Ensure apt timers are enabled
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
